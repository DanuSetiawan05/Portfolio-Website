  - degree: B.S. Computer Science
    institution: Mercu Buana University
    start: 2022-08-29
    end: 2026-02-27
    summary: |
      Thesis Research: 
      "Classification and Analysis of Food Insecurity News Text Using IndoBERT and IndoBERT-SVM Algorithms" 
      * Classified 2,700+ news articles on food insecurity in Indonesia into three risk categories (Safe, Vulnerable, Alert) using 
      IndoBERT and IndoBERT-SVM models, applying keyword-based tagging on news data collected between January 2021 
      and June 2025. 
      * Processed and cleaned 2,708 of 2,715 collected news articles, successfully classifying 2,201 items to support automated, 
      text-based food security monitoring. 
      * Evaluated model performance across multiple epoch configurations (3, 5, 7, 10) using accuracy, precision, recall, and F1
      score, identifying IndoBERT at 10 epochs as the best-performing model, outperforming IndoBERT-SVM.

